[versions]
java = "17"
kotlin = "2.4.20"
android-plugin = "9.5.0-alpha05"
android-minSDK = "24"
android-compileSDK = "37"
androidx-lifecycle = "2.11.0"
androidx-navigation = "2.10.1"
moshi = "1.15.2"
screenshot-tests = "0.0.1-alpha16"

[libraries]
android-tools-screenshot-validation-api = { module = "com.android.tools.screenshot:screenshot-validation-api", version.ref = "screenshot-tests" }
androidx-core = "androidx.core:core-ktx:1.19.0"
androidx-appcompat = "androidx.appcompat:appcompat:1.8.0"
androidx-annotation = "androidx.annotation:annotation:1.10.0"
androidx-compose = { module = "androidx.compose:compose-bom", version = "2026.09.00" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-constraintlayout = "androidx.constraintlayout:constraintlayout:2.2.2"
androidx-livedata = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "androidx-lifecycle" }
androidx-navigation-fragment = { module = "androidx.navigation:navigation-fragment-ktx", version.ref = "androidx-navigation" }
androidx-navigation-ui = { module = "androidx.navigation:navigation-ui-ktx", version.ref = "androidx-navigation" }
androidx-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "androidx-lifecycle" }
androidx-test-core-ktx = "androidx.test:core-ktx:1.7.0"
androidx-test-junit = "androidx.test.ext:junit:1.3.0"
androidx-test-espresso = "androidx.test.espresso:espresso-core:3.7.0"
ant = "org.apache.ant:ant:1.10.18"
ant-jacoco = "org.jacoco:org.jacoco.ant:0.8.15"
diffUtils = { module = "io.github.java-diff-utils:java-diff-utils", version = "4.17" }
google-material = "com.google.android.material:material:1.14.0"
junit-bom = { module = "org.junit:junit-bom", version = "6.1.3" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params" }
kotlin-bom = { module = "org.jetbrains.kotlin:kotlin-bom", version.ref = "kotlin" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit" }
mockk = { module = "io.mockk:mockk", version = "1.14.11" }
moshi-kotlin = { module = "com.squareup.moshi:moshi-kotlin", version.ref = "moshi" }
moshi-codegen = { module = "com.squareup.moshi:moshi-kotlin-codegen", version.ref = "moshi" }
robolectric = "org.robolectric:robolectric:4.17"

[plugins]
android = { id = "com.android.application", version.ref = "android-plugin" }
android-lib = { id = "com.android.library", version.ref = "android-plugin" }
android-multiplatform = { id = "com.android.kotlin.multiplatform.library", version.ref = "android-plugin" }
android-test = { id = "com.android.test", version.ref = "android-plugin" }
android-baseline = { id = "androidx.baselineprofile", version = "1.5.0" }
buildconfig = { id = "com.github.gmazzo.buildconfig", version = "6.1.1" }
dokka = { id = "org.jetbrains.dokka-javadoc", version = "2.2.0" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-ksp = { id = "com.google.devtools.ksp", version = "2.3.12" }
kotlin-samReceiver = { id = "org.jetbrains.kotlin.plugin.sam.with.receiver", version.ref = "kotlin" }
gitVersion = { id = "io.github.gmazzo.gitversion", version = "1.6.1" }
gradle-pluginPublish = { id = "com.gradle.plugin-publish", version = "2.2.1" }
gradle-testkit-jacoco = { id = "io.github.gmazzo.gradle.testkit.jacoco", version = "1.1.1" }
mavenPublish = { id = "com.vanniktech.maven.publish", version = "0.37.0" }
publicationsReport = { id = "io.github.gmazzo.publications.report", version = "1.4.1" }
