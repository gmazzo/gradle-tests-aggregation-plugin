plugins {
    id("com.android.library")
}

androidComponents {
    onVariants(selector().all()) {
        it.compileConfiguration.aggregateTests.set(it.buildType == "debug")
    }
}

android {
    namespace = "org.test.lib"

    compileSdk = 34

    buildTypes.all {
        enableUnitTestCoverage = true
        enableAndroidTestCoverage = true
    }

    testOptions.managedDevices.localDevices {
        register("emulator") {
            device = "Pixel 10"
            apiLevel = 33
            systemImageSource = "aosp_atd"
        }
    }
}
